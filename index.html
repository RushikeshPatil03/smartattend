<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Prevent browser/CDN from caching entrypoint HTML with stale chunk hashes -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>SmartAttend</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Preload/Prefetch local face models to eliminate CDN cold start and attendance delay -->
    <link rel="prefetch" href="/models/face-api.min.js" as="script">
    <link rel="prefetch" href="/models/tiny_face_detector_model-weights_manifest.json" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="/models/face_landmark_68_tiny_model-weights_manifest.json" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="/models/face_recognition_model-weights_manifest.json" as="fetch" crossorigin="anonymous">

    <!-- Purge any stale service workers or caches from previous deployments -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
      }
    </script>
  </head>

  <body class="bg-[#f8fbff] text-slate-900 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
